[project]
name = "tradingagent"
version = "0.1.0"
description = "Agente de recomendaciones de trading: datos, indicadores, setups y backtest"
requires-python = ">=3.10"
dependencies = ["ccxt>=4.0", "pandas>=2.0", "numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]
llm = ["anthropic>=2.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
